<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="glosslint favicon">
  <title>glosslint</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>

    <radialGradient id="pool" cx="128" cy="128" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22e8ff" stop-opacity="0.28"/>
      <stop offset="58%" stop-color="#2ef5a3" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2ef5a3" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tube-grad" x1="68" y1="40" x2="188" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24e8ff"/>
      <stop offset="52%" stop-color="#26f0d8"/>
      <stop offset="100%" stop-color="#34f5a3"/>
    </linearGradient>

    <linearGradient id="core-grad" x1="68" y1="40" x2="188" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#eefff7"/>
    </linearGradient>

    <filter id="glow-wide" filterUnits="userSpaceOnUse" x="-40" y="-40" width="336" height="336">
      <feGaussianBlur in="SourceGraphic" stdDeviation="11" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Extra-bold centered bent neon tube "g" tuned for 16px-32px favicon legibility -->
    <g id="mark-g" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 184 98 A 56 56 0 1 0 72 98 A 56 56 0 1 0 184 98"/>
      <path d="M 184 44 L 184 160 C 184 208, 144 222, 88 204"/>
    </g>
  </defs>

  <!-- Minimal dark squircle so the neon mark stays sharp on both light and dark browser tabs -->
  <rect width="256" height="256" rx="64" fill="url(#bg)"/>
  <rect width="256" height="256" rx="64" fill="url(#pool)"/>

  <g filter="url(#glow-wide)" opacity="0.86">
    <use href="#mark-g" stroke="url(#tube-grad)" stroke-width="26"/>
  </g>
  <use href="#mark-g" stroke="url(#tube-grad)" stroke-width="24"/>
  <use href="#mark-g" stroke="url(#core-grad)" stroke-width="9.6" opacity="0.96"/>
</svg>
